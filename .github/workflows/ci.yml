name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (includes the security rules)
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests with coverage
        run: uv run pytest --cov=farejador --cov-report=xml --cov-fail-under=80
      - name: Install the dashboard toolchain (no install scripts)
        run: npm --prefix web ci --ignore-scripts
      - name: Dashboard types (strict)
        run: npm --prefix web run check
      - name: Dashboard tests
        run: npm --prefix web test
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build -t farejador:ci .
      - name: The CLI runs inside the container as a non-root user
        run: |
          docker run --rm farejador:ci version
          docker run --rm --entrypoint python farejador:ci -c "from farejador.web import DEFAULT_STATIC_DIR as d; assert (d / 'index.html').is_file() and (d / 'assets' / 'main.js').is_file(), 'the dashboard is not in the image'"
          test -z "$(docker run --rm --entrypoint sh farejador:ci -c 'command -v node || true')"
          test "$(docker run --rm --entrypoint id farejador:ci -u)" != "0"
      - name: Compose profiles are valid
        run: |
          openssl genrsa -out "$RUNNER_TEMP/app.pem" 2048
          printf '%s\n' \
            FAREJADOR_GITHUB_APP_ID=1 \
            FAREJADOR_GITHUB_PRIVATE_KEY_PATH=/run/secrets/github_app.pem \
            FAREJADOR_WEBHOOK_SECRET=ci-secret \
            FAREJADOR_OPENROUTER_API_KEY=sk-or-ci-key \
            FAREJADOR_MODEL=test/model > "$RUNNER_TEMP/ci.env"
          export FAREJADOR_ENV_FILE="$RUNNER_TEMP/ci.env"
          export FAREJADOR_PRIVATE_KEY_FILE="$RUNNER_TEMP/app.pem"
          docker compose --profile polling config --quiet
          docker compose --profile webhook config --quiet
