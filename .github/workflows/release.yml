name: Release

# Runs only when a version tag is pushed. The image is built, signed and published; it only becomes
# "stable" (what the server follows) after a person approves the "production" environment.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# No permission by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/luk3rr/farejador

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag must point to a commit that is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (includes the security rules)
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests with coverage
        run: uv run pytest --cov=farejador --cov-fail-under=80

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version and short commit
        id: version
        run: |
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.number }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.number }}

  sign:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4  # keep equal to COSIGN_VERSION in deploy/bootstrap.sh
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  promote:
    needs: [publish, sign]
    runs-on: ubuntu-latest
    # Waits for the required reviewer: this is the manual approval gate.
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4  # keep equal to COSIGN_VERSION in deploy/bootstrap.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The digest must carry a valid signature from this workflow
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/release.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Move stable to the approved digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE}:stable" "${IMAGE}@${DIGEST}"
