[project]
name = "farejador"
version = "0.1.0"
description = "Agentic first-pass code reviewer for GitHub pull requests"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "openai>=3.57.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
farejador = "farejador.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
    "respx>=0.23.1",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farejador"]
# The compiled dashboard is ignored by git but belongs in the wheel.
artifacts = ["src/farejador/web/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"src/farejador/agent/prompts.py" = ["E501"]  # long prose lines in prompts
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["farejador"]
branch = true
omit = ["src/farejador/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", '^\s*\.\.\.$']
